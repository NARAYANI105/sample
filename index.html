
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spice Garden Restaurant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff8f0;
            margin: 0;
            text-align: center;
        }

        header {
            background: #b83b1e;
            color: white;
            padding: 20px;
        }

        .menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 25px;
        }

        .item {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ddd;
        }

        button {
            background: #b83b1e;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #812713;
        }

        #cart {
            background: white;
            margin: 20px auto;
            padding: 20px;
            max-width: 400px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍕 Spice Garden</h1>
        <p>Delicious Food, Happy Moments!</p>
    </header>

    <h2>Our Menu</h2>

    <div class="menu">
        <div class="item">
            <h3>Pizza</h3>
            <p>₹199</p>
            <button onclick="addItem('Pizza', 199)">Add to Cart</button>
        </div>

        <div class="item">
            <h3>Cold Coffee</h3>
            <p>₹99</p>
            <button onclick="addItem('Cold Coffee', 99)">Add to Cart</button>
        </div>

        <div class="item">
            <h3>Garlic Bread</h3>
            <p>₹99</p>
            <button onclick="addItem('Garlic Bread', 99)">Add to Cart</button>
        </div>
    </div>

    <div id="cart">
        <h2>🛒 Shopping Cart</h2>
        <ul id="items"></ul>
        <h3>Total: ₹<span id="total">0</span></h3>
        <button onclick="checkout()">Place Order</button>
    </div>

    <script>
        let total = 0;

        function addItem(name, price) {
            let item = document.createElement("li");
            item.textContent = name + " - ₹" + price;
            document.getElementById("items").appendChild(item);

            total += price;
            document.getElementById("total").textContent = total;
        }

        function checkout() {
            if (total === 0) {
                alert("Please add items to your cart!");
            } else {
                alert("Order placed successfully! Total: ₹" + total);
                document.getElementById("items").innerHTML = "";
                total = 0;
                document.getElementById("total").textContent = total;
            }
        }
    </script>

</body>
</html>
